name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET10_VERSION: "10.0.x"
  DOTNET11_VERSION: "11.0.x"
  DOTNET_CACHE: "dotnet-cache-${{ github.sha }}"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/dotnet-build.yml"

permissions:
  contents: read

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET10_VERSION }}
            ${{ env.DOTNET11_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/cache@v4
        id: dotnet-output
        with:
          path: ./**/bin
          key: ${{ env.DOTNET_CACHE }}

      - name: Build
        run: dotnet build --configuration Release -p:SpecificationsTestFrameworks='"net10.0;net11.0"'

  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [dotnet-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET10_VERSION }}
            ${{ env.DOTNET11_VERSION }}

      - uses: actions/cache@v4
        id: dotnet-output
        with:
          path: ./**/bin
          key: ${{ env.DOTNET_CACHE }}

      - name: Run specifications
        run: |
          for framework in net10.0 net11.0; do
            ./Source/CodeAnalysis.Specs/bin/Release/$framework/Cratis.Architecture.CodeAnalysis.Specs
          done
